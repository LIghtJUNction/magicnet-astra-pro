<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>MagicNet</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="bridge.js"></script>
  <script defer src="lang.js"></script>
  <script defer src="app.js"></script>
  <script defer src="nodes.js"></script>
  <script defer src="traffic.js"></script>
</head>
<body>
<main>
  <header><h1>MagicNet</h1><div class="tools"><select id="language" aria-label="Language"><option value="zh">简体中文</option><option value="en">English</option><option value="ru">Русский</option></select><button data-i18n id="refresh" class="quiet" type="button">刷新</button></div></header>
  <section aria-labelledby="health">
    <h2 data-i18n id="health">本机代理</h2>
    <p data-i18n class="state" id="state" role="status">读取中</p>
    <p data-i18n class="hint" id="scope">支持 SOCKS5 与 HTTP CONNECT。请在使用代理的应用内填写本机地址。</p>
    <dl>
      <div><dt data-i18n>本机地址</dt><dd id="listen">—</dd></div>
      <div><dt data-i18n>当前上游</dt><dd id="upstream">—</dd></div>
    </dl>
    <button data-i18n type="button" id="toggle" disabled>启动代理</button>
  </section>
  <section aria-labelledby="endpoint-heading">
    <h2 data-i18n id="endpoint-heading">上游节点</h2>
    <form id="endpoint-form">
      <label data-i18n for="endpoint">Shadowsocks、SOCKS5、HTTP 或 HTTPS 地址</label>
      <input id="endpoint" type="password" required maxlength="8192" placeholder="socks5://192.0.2.1:1080" autocomplete="off" autocapitalize="none" spellcheck="false">
      <p data-i18n class="hint">域名上游使用加密 DNS。HTTPS 上游可添加 ?server_name=证书域名。应用交给代理的域名由上游解析。</p>
      <button data-i18n type="submit" id="save" disabled>保存并启动</button>
    </form>
  </section>
  <details id="subscriptions">
    <summary data-i18n>从订阅导入</summary>
    <form id="import-form">
      <label data-i18n for="source">订阅来源</label>
      <select id="source"><option data-i18n value="file">本地文件</option><option data-i18n value="remote">HTTPS 地址</option></select>
      <div id="local-fields">
        <label data-i18n for="file">订阅文件</label>
        <input type="file" id="file">
        <p data-i18n class="hint">网页支持 32 KiB 以内的文件。更大的文件可通过 shell 的 import 命令导入。</p>
      </div>
      <div id="remote-fields" hidden>
        <label data-i18n for="url">订阅地址</label>
        <input id="url" type="password" placeholder="https://…" autocomplete="off" autocapitalize="none" spellcheck="false">
        <label for="ua">User-Agent <small data-i18n>可选</small></label>
        <input id="ua" maxlength="256" placeholder="MagicNet/0.1" autocomplete="off">
        <p data-i18n class="hint">已配置的节点负责下载订阅。首次导入使用加密 DNS 和 HTTPS。</p>
      </div>
      <button data-i18n id="preview" type="button" disabled>读取节点</button>
      <div id="picker" hidden>
        <label data-i18n for="filter">搜索节点</label>
        <input id="filter" type="search" autocomplete="off">
        <label data-i18n for="node">选择节点</label>
        <select id="node"></select>
        <button data-i18n type="submit" id="import" disabled>应用订阅节点</button>
      </div>
    </form>
  </details>
  <details id="routing">
    <summary data-i18n>应用与热点分流</summary>
    <form id="route-form">
      <p data-i18n class="hint">选中范围的公网 TCP 连接经过代理。直接访问 DNS 的 53 和 853 端口会被阻止。</p>
      <label data-i18n for="route-apps">应用包名与 UID（可多选）</label>
      <select id="route-apps" multiple size="4"></select>
      <label data-i18n for="route-tethers">热点接口（多个用空格隔开）</label>
      <input id="route-tethers" placeholder="wlan1" autocomplete="off" autocapitalize="none" spellcheck="false">
      <p class="hint" id="route-status" role="status"></p>
      <button data-i18n type="submit" id="route-apply" disabled>应用分流</button>
      <button data-i18n type="button" id="route-clear" class="quiet" disabled>清除分流</button>
    </form>
  </details>
  <p role="status" aria-live="polite" id="message"></p>
</main>
</body>
</html>
